packages:
  - "apps/*"
  - "packages/*"

# Scripts de instalacion permitidos: Prisma necesita descargar sus motores,
# esbuild y sharp compilan/descargan binarios nativos.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
