# Entorno local equivalente a produccion: PostgreSQL, Redis y almacenamiento
# compatible con S3. El servicio de IA se anade en la fase 6.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archvision
      POSTGRES_PASSWORD: archvision
      POSTGRES_DB: archvision
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archvision
      MINIO_ROOT_PASSWORD: archvision-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  web:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  storage-data:
