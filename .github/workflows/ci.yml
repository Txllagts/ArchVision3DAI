name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Valores solo para compilar y ejecutar pruebas; sin datos reales.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "clave-de-integracion-continua-de-al-menos-32-caracteres"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        run: pnpm db:generate

      - name: Comprobacion de tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Compilacion
        run: pnpm build
